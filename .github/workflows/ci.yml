name: CI

on:
  push:
    branches:
      - main
      - queue
  pull_request:
  # release.yml runs the same jobs on the commit it releases.
  workflow_call:

permissions:
  contents: read

# Actions are pinned to a commit. A tag can be moved to another commit, so a
# tag reference says which version its owner offers today rather than which
# code this workflow ran last time.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: [ "3.4", "4.0" ]
    env:
      QUINT: quint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global @informalsystems/quint@0.33.0
      # quint asks the GitHub API for its Rust evaluator, and a shared runner
      # can run out of the API's unauthenticated limit. The release download
      # is outside that limit.
      - name: Install the Quint Rust evaluator
        run: |
          dir="$HOME/.quint/rust-evaluator-v0.7.0"
          mkdir -p "$dir"
          curl -fsSL --retry 3 https://github.com/quint-co/quint/releases/download/evaluator/v0.7.0/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$dir"
          chmod +x "$dir/quint_evaluator"
      - run: bundle exec bin/test
      - run: bundle exec rspec

  # The rbs-inline comments in lib/ against the code. sig/generated is what
  # rbs-inline writes from them, so it has to match the commit, a new file too.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rbs-inline --output=sig/generated lib
      - run: git add --intent-to-add sig && git diff --exit-code sig
      - name: Check the types
        run: |
          # Steep logs FATAL or ERROR and skips the rest of a method when it
          # cannot type a node, and still prints "No type error detected".
          set -o pipefail
          bundle exec steep check 2>&1 | tee steep.log
          if grep -E ': (FATAL|ERROR): \[Steep' steep.log; then
            echo "Steep stopped checking the code on the lines above." >&2
            exit 1
          fi

  # Trace replay and the model on the core's floor, with no hegeltest installed.
  # The types group holds Steep, which only the types job runs.
  core:
    runs-on: ubuntu-latest
    env:
      QUINT: quint
      BUNDLE_WITHOUT: hegel:types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global @informalsystems/quint@0.33.0
      # quint asks the GitHub API for its Rust evaluator, and a shared runner
      # can run out of the API's unauthenticated limit. The release download
      # is outside that limit.
      - name: Install the Quint Rust evaluator
        run: |
          dir="$HOME/.quint/rust-evaluator-v0.7.0"
          mkdir -p "$dir"
          curl -fsSL --retry 3 https://github.com/quint-co/quint/releases/download/evaluator/v0.7.0/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$dir"
          chmod +x "$dir/quint_evaluator"
      - run: bundle exec bin/test test/*_test.rb
      - run: bundle exec rspec --exclude-pattern "spec/hegel/**/*_spec.rb"

  # The hunt in test/fixture/depot, a Rails app with a Gemfile of its own. Only
  # this job installs that app's gems, so the other jobs skip the test.
  depot:
    runs-on: ubuntu-latest
    env:
      QUINT: quint
      QUINT_DRIVER_DEPOT: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install --global @informalsystems/quint@0.33.0
      # quint asks the GitHub API for its Rust evaluator, and a shared runner
      # can run out of the API's unauthenticated limit. The release download
      # is outside that limit.
      - name: Install the Quint Rust evaluator
        run: |
          dir="$HOME/.quint/rust-evaluator-v0.7.0"
          mkdir -p "$dir"
          curl -fsSL --retry 3 https://github.com/quint-co/quint/releases/download/evaluator/v0.7.0/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$dir"
          chmod +x "$dir/quint_evaluator"
      # The test runs a copy of the app in a temporary directory, so the gems
      # go to Ruby's own gem directory, where a bundle outside this checkout
      # finds them.
      - name: Install the depot's gems
        working-directory: test/fixture/depot
        run: bundle install
      - run: bundle exec bin/test test/depot_test.rb
